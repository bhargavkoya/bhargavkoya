VARCHAR(5) NOT NULL CHECK (blood_group IN ('A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-')),\n    phone VARCHAR(20),\n    email VARCHAR(100),\n    address NVARCHAR(200),\n    city NVARCHAR(50),\n    state VARCHAR(2),\n    zip_code VARCHAR(10),\n    registration_date DATE DEFAULT GETDATE(),\n    last_donation_date DATE,\n    is_active BIT DEFAULT 1,\n    created_at DATETIME2 DEFAULT GETDATE(),\n    updated_at DATETIME2 DEFAULT GETDATE()\n);"}, {"t": "p", "x": "Design Rationale: We use VARCHAR(10) for donor_id to support alphanumeric identifiers like \"D1001\". The blood_group constraint ensures data integrity at the database level, preventing invalid blood types from entering the system. The last_donation_date field enables quick eligibility checks without joining to the donation history table."}, {"t": "h3", "x": "Blood Inventory Table Structure"}, {"t": "code", "lang": "sql", "x": "CREATE TABLE BloodInventory (\n    inventory_id VARCHAR(10) PRIMARY KEY,\n    blood_group VARCHAR(5) NOT NULL,\n    units_available INT NOT NULL CHECK (units_available >= 0),\n    collection_date DATE NOT NULL,\n    expiry_date DATE NOT NULL,\n    blood_center_id VARCHAR(10) NOT NULL,\n    storage_location VARCHAR(50),\n    status VARCHAR(20) DEFAULT 'Available' CHECK (status IN ('Available', 'Reserved', 'Expired', 'Issued')),\n    created_at DATETIME2 DEFAULT GETDATE(),\n    updated_at DATETIME2 DEFAULT GETDATE(),\n    CONSTRAINT CHK_ExpiryAfterCollection CHECK (expiry_date > collection_date)\n);"}, {"t": "p", "x": "Key Design Features:"}, {"t": "ul", "items": ["Check constraints prevent negative inventory and ensure logical date relationships", "Status enumeration controls inventory lifecycle states", "Computed expiry validation prevents data entry errors that could lead to issuing expired blood"]}, {"t": "h2", "x": "Step 3: Implementing Referential Integrity"}, {"t": "p", "x": "Referential integrity is crucial in healthcare databases where orphaned records can lead to compliance violations and patient safety issues."}, {"t": "h3", "x": "Blood Requests Table with Foreign Key Relationships"}, {"t": "code", "lang": "sql", "x": "CREATE TABLE BloodRequests (\n    request_id VARCHAR(10) PRIMARY KEY,\n    hospital_id VARCHAR(10) NOT NULL,\n    blood_group VARCHAR(5) NOT NULL,\n    units_requested INT NOT NULL CHECK (units_requested > 0),\n    urgency_level VARCHAR(10) NOT NULL CHECK (urgency_level IN ('Low', 'Medium', 'High', 'Critical')),\n    request_date DATE DEFAULT GETDATE(),\n    required_date DATE NOT NULL,\n    status VARCHAR(15) DEFAULT 'Pending' CHECK (status IN ('Pending', 'Approved', 'Fulfilled', 'Rejected', 'Cancelled')),\n    patient_name NVARCHAR(100),\n    medical_notes NVARCHAR(500),\n    assigned_inventory_id VARCHAR(10),\n    processed_by VARCHAR(50),\n    created_at DATETIME2 DEFAULT GETDATE(),\n    updated_at DATETIME2 DEFAULT GETDATE(),\n\n    FOREIGN KEY (hospital_id) REFERENCES Hospitals(hospital_id),\n    FOREIGN KEY (assigned_inventory_id) REFERENCES BloodInventory(inventory_id),\n    CONSTRAINT CHK_RequiredDateAfterRequest CHECK (required_date >= request_date)\n);"}, {"t": "h3", "x": "Donation History: Linking Everything Together"}, {"t": "code", "lang": "sql", "x": "CREATE TABLE DonationHistory (\n    donation_id VARCHAR(10) PRIMARY KEY,\n    donor_id VARCHAR(10) NOT NULL,\n    donation_date DATE NOT NULL,\n    blood_center_id VARCHAR(10) NOT NULL,\n    units_donated INT DEFAULT 1 CHECK (units_donated > 0),\n    hemoglobin_level DECIMAL(3,1),\n    blood_pressure_systolic INT,\n    blood_pressure_diastolic INT,\n    weight_kg DECIMAL(5,1),\n    donation_type VARCHAR(20) DEFAULT 'Whole Blood',\n    staff_id VARCHAR(10),\n    notes NVARCHAR(500),\n    inventory_id VARCHAR(10),\n    created_at DATETIME2 DEFAULT GETDATE(),\n\n    FOREIGN KEY (donor_id) REFERENCES Donors(donor_id),\n    FOREIGN KEY (inventory_id) REFERENCES BloodInventory(inventory_id)\n);"}, {"t": "p", "x": "Why Foreign Keys Matter: Foreign key constraints prevent orphaned records and maintain referential integrity. For example, we can’t delete a donor who has donation records, ensuring complete audit trails for regulatory compliance."}, {"t": "h2", "x": "Step 4: Normalization Strategy"}, {"t": "p", "x": "Proper normalization eliminates data redundancy while maintaining query performance. Let’s examine our normalization approach:"}, {"t": "h3", "x": "First Normal Form (1NF) Compliance"}, {"t": "p", "x": "All our tables store atomic values. Instead of storing “John Doe, Mary Smith” in a single field, we maintain separate first_name and last_name columns."}, {"t": "h3", "x": "Second Normal Form (2NF) Implementation"}, {"t": "p", "x": "We’ve eliminated partial dependencies by ensuring all non-key attributes depend on the entire primary key. For example, in DonationHistory, both donor_id and donation_date are needed to uniquely identify health metrics for that specific donation."}, {"t": "h3", "x": "Third Normal Form (3NF) Optimization"}, {"t": "p", "x": "We’ve removed transitive dependencies. Blood group information is stored in the Donors table (where it’s determined by biology) rather than being repeated in every BloodInventory."}, {"t": "h3", "x": "Strategic Denormalization"}, {"t": "p", "x": "However, we strategically violate 3NF in some cases for performance. For example, we store last_donation_date in the Donors table to avoid expensive joins when checking eligibility."}, {"t": "code", "lang": "sql", "x": "-- Without denormalization (expensive)\nSELECT d.donor_id, d.first_name, d.last_name\nFROM Donors d\nLEFT JOIN DonationHistory dh ON d.donor_id = dh.donor_id\nWHERE d.is_active = 1\n  AND (dh.donation_date IS NULL OR dh.donation_date < DATEADD(day, -56, GETDATE()));\n\n-- With denormalization (fast)\nSELECT donor_id, first_name, last_name\nFROM Donors\nWHERE is_active = 1\n  AND (last_donation_date IS NULL OR last_donation_date < DATEADD(day, -56, GETDATE()));"}, {"t": "p", "x": "This denormalization improves query performance by 300–400% in typical donor eligibility checks."}, {"t": "h2", "x": "Step 5: Indexing Strategy for Performance"}, {"t": "p", "x": "Strategic indexing is crucial for healthcare databases that need sub-second response times."}, {"t": "h3", "x": "Primary Indexes"}, {"t": "code", "lang": "sql", "x": "-- Clustered index on blood_group for inventory queries\nCREATE CLUSTERED INDEX IX_BloodInventory_BloodGroup_Status\nON BloodInventory (blood_group, status, expiry_date);\n\n-- Non-clustered index for donor searches\nCREATE NONCLUSTERED INDEX IX_Donors_Name_BloodGroup\nON Donors (last_name, first_name, blood_group)\nINCLUDE (phone, email, is_active);\n\n-- Covering index for request processing\nCREATE NONCLUSTERED INDEX IX_BloodRequests_Status_Priority\nON BloodRequests (status, urgency_level, required_date)\nINCLUDE (blood_group, units_requested, hospital_id);"}, {"t": "p", "x": "Index Design Rationale:"}, {"t": "ul", "items": ["Clustered index on BloodInventory organizes data physically by blood_group, making inventory queries extremely fast", "Covering indexes include frequently accessed columns to avoid key lookups", "Composite indexes support multi-column WHERE clauses and ORDER BY operations"]}, {"t": "h3", "x": "Query-Specific Indexing"}, {"t": "p", "x": "For emergency blood requests, we need lightning-fast queries:"}, {"t": "code", "lang": "sql", "x": "-- Emergency inventory check (sub-100ms response time)\nSELECT TOP 10 inventory_id, units_available, expiry_date\nFROM BloodInventory\nWHERE blood_group = 'O-'\n  AND status = 'Available'\n  AND expiry_date > GETDATE()\nORDER BY expiry_date;"}, {"t": "p", "x": "The clustered index on (blood_group, status, expiry_date) makes this query execute in under 50ms even with millions of inventory records."}, {"t": "h2", "x": "Step 6: Advanced Features and Business Logic"}, {"t": "h3", "x": "Automated Eligibility Checking"}, {"t": "code", "lang": "sql", "x": "CREATE FUNCTION dbo.CheckDonorEligibility(@donor_id VARCHAR(10))\nRETURNS BIT\nAS\nBEGIN\n    DECLARE @eligible BIT = 0;\n    DECLARE @last_donation_date DATE;\n    DECLARE @donor_age INT;\n\n    SELECT @last_donation_date = last_donation_date,\n           @donor_age = DATEDIFF(year, date_of_birth, GETDATE())\n    FROM Donors\n    WHERE donor_id = @donor_id AND is_active = 1;\n\n    -- Check age requirements (18-65 years)\n    -- Check 56-day interval for whole blood donations\n    IF @donor_age BETWEEN 18 AND 65\n       AND (@last_donation_date IS NULL OR @last_donation_date <= DATEADD(day, -56, GETDATE()))\n        SET @eligible = 1;\n\n    RETURN @eligible;\nEND;"}, {"t": "h3", "x": "Blood Compatibility Checking"}, {"t": "code", "lang": "sql", "x": "CREATE FUNCTION dbo.GetCompatibleBloodGroups(@recipient_blood_group VARCHAR(5))\nRETURNS TABLE\nAS\nRETURN (\n    SELECT blood_group\n    FROM (VALUES\n        ('O-', 'O-,A-,B-,AB-,A+,B+,AB+,O+'),\n        ('O+', 'O+,A+,B+,AB+'),\n        ('A-', 'A-,AB-,A+,AB+'),\n        ('A+', 'A+,AB+'),\n        ('B-', 'B-,AB-,B+,AB+'),\n        ('B+', 'B+,AB+'),\n        ('AB-', 'AB-,AB+'),\n        ('AB+', 'AB+')\n    ) AS compatibility(recipient, compatible_donors)\n    WHERE recipient = @recipient_blood_group\n      AND CHARINDEX(@recipient_blood_group, compatible_donors) > 0\n);"}, {"t": "h2", "x": "Step 7: Performance Optimization and Query Tuning"}, {"t": "h3", "x": "Query Plan Analysis"}, {"t": "p", "x": "Let’s examine execution plans for our critical queries:"}, {"t": "code", "lang": "sql", "x": "-- Enable execution plan analysis\nSET STATISTICS IO ON;\nSET STATISTICS TIME ON;\n\n-- Critical query: Find available blood for emergency request\nSELECT i.inventory_id, i.units_available, i.expiry_date\nFROM BloodInventory i\nWHERE i.blood_group = 'O-'\n  AND i.status = 'Available'\n  AND i.units_available > 0\n  AND i.expiry_date > GETDATE()\nORDER BY i.expiry_date;"}, {"t": "p", "x": "Performance Metrics:"}, {"t": "ul", "items": ["Logical reads: 3 pages (with proper indexing)", "Execution time: <50ms", "Index usage: 100% (no table scans)"]}, {"t": "h3", "x": "Optimization Techniques"}, {"t": "p", "x": "1. Materialized Views for Reporting"}, {"t": "code", "lang": "sql", "x": "CREATE VIEW vw_InventorySummary WITH SCHEMABINDING\nAS\nSELECT\n    blood_group,\n    COUNT_BIG(*) as total_units,\n    SUM(units_available) as available_units,\n    MIN(expiry_date) as earliest_expiry\nFROM dbo.BloodInventory\nWHERE status = 'Available'\nGROUP BY blood_group;\n\n-- Create clustered index on the view\nCREATE UNIQUE CLUSTERED INDEX IX_InventorySummary_BloodGroup\nON vw_InventorySummary (blood_group);"}, {"t": "p", "x": "2. Partitioning for Large Tables"}, {"t": "code", "lang": "sql", "x": "-- Partition donation history by year for better performance\nCREATE PARTITION FUNCTION pf_DonationYear (DATE)\nAS RANGE RIGHT FOR VALUES\n('2023-01-01', '2024-01-01', '2025-01-01');\n\nCREATE PARTITION SCHEME ps_DonationYear\nAS PARTITION pf_DonationYear ALL TO ([PRIMARY]);\n\n-- Apply partitioning to large tables\nCREATE TABLE DonationHistory_Partitioned (\n    -- Same structure as before\n) ON ps_DonationYear(donation_date);"}, {"t": "h2", "x": "Enterprise-Scale Best Practices"}, {"t": "h3", "x": "1. High Availability and Disaster Recovery"}, {"t": "p", "x": "For mission-critical healthcare systems, implement Always On Availability Groups:"}, {"t": "code", "lang": "sql", "x": "-- Configure Always On for 99.9% uptime\nCREATE AVAILABILITY GROUP BloodBankAG\nWITH (AUTOMATED_BACKUP_PREFERENCE = SECONDARY)\nFOR DATABASE BloodDonationDB\nREPLICA ON 'Primary-Server' WITH (\n    ENDPOINT_URL = 'TCP://Primary-Server:5022',\n    AVAILABILITY_MODE = SYNCHRONOUS_COMMIT,\n    FAILOVER_MODE = AUTOMATIC\n);"}, {"t": "h3", "x": "2. Security Implementation"}, {"t": "p", "x": "Healthcare data requires robust security measures:"}, {"t": "code", "lang": "sql", "x": "-- Create role-based access control\nCREATE ROLE BloodBankStaff;\nGRANT SELECT, INSERT, UPDATE ON Donors TO BloodBankStaff;\nGRANT SELECT, UPDATE ON BloodInventory TO BloodBankStaff;\n\nCREATE ROLE HospitalUsers;\nGRANT SELECT ON BloodInventory TO HospitalUsers;\nGRANT INSERT, SELECT ON BloodRequests TO HospitalUsers;\n\n-- Implement row-level security for multi-tenant scenarios\nCREATE FUNCTION dbo.hospital_security_predicate(@hospital_id VARCHAR(10))\nRETURNS TABLE\nWITH SCHEMABINDING\nAS\nRETURN SELECT 1 AS access_result\nWHERE @hospital_id = USER_NAME() OR IS_MEMBER('db_owner') = 1;\n\nCREATE SECURITY POLICY HospitalDataAccess\nADD FILTER PREDICATE dbo.hospital_security_predicate(hospital_id)\nON BloodRequests;"}, {"t": "h3", "x": "3. Monitoring and Performance Tracking"}, {"t": "code", "lang": "sql", "x": "-- Create performance monitoring\nCREATE TABLE PerformanceMetrics (\n    metric_id BIGINT IDENTITY PRIMARY KEY,\n    query_type VARCHAR(100),\n    execution_time_ms INT,\n    logical_reads BIGINT,\n    recorded_at DATETIME2 DEFAULT GETDATE()\n);\n\n-- Automated performance logging\nCREATE TRIGGER tr_QueryPerformance\nON DATABASE\nFOR DDL_DATABASE_LEVEL_EVENTS\nAS\nBEGIN\n    -- Log performance metrics for analysis\n    INSERT INTO PerformanceMetrics (query_type, execution_time_ms)\n    VALUES (EVENTDATA().value('(/EVENT_INSTANCE/TSQLCommand/CommandText)[1]', 'NVARCHAR(MAX)'),\n            @@CPU_BUSY);\nEND;"}, {"t": "h3", "x": "4. Scalability Patterns for Large Organizations"}, {"t": "p", "x": "Read Replicas for Analytics"}, {"t": "code", "lang": "sql", "x": "-- Configure read-only replicas for reporting\nCREATE AVAILABILITY GROUP BloodBankAG_Analytics\nWITH (READ_ONLY_ROUTING_LIST = ('Analytics-Server1', 'Analytics-Server2'));"}, {"t": "p", "x": "Database Sharding Strategy"}, {"t": "p", "x": "For big organizations, implement geographical sharding:"}, {"t": "code", "lang": "sql", "x": "-- Shard by region for better performance\nCREATE FUNCTION dbo.GetShardKey(@state VARCHAR(2))\nRETURNS INT\nAS\nBEGIN\n    RETURN CASE\n        WHEN @state IN ('CA', 'NV', 'OR', 'WA') THEN 1  -- West Coast\n        WHEN @state IN ('NY', 'NJ', 'CT', 'MA') THEN 2  -- Northeast\n        WHEN @state IN ('TX', 'OK', 'LA', 'AR') THEN 3  -- South Central\n        ELSE 4                                          -- Other regions\n    END;\nEND;"}, {"t": "h2", "x": "Handling Bottlenecks in Large-Scale Systems"}, {"t": "h3", "x": "1. Connection Pooling Optimization"}, {"t": "code", "lang": "sql", "x": "-- Configure connection pooling for high-traffic scenarios\nEXEC sp_configure 'max worker threads', 512;\nEXEC sp_configure 'max server memory', 8192; -- 8GB for SQL Server\nRECONFIGURE;"}, {"t": "h3", "x": "2. Caching Strategy"}, {"t": "p", "x": "Implement Redis caching for frequently accessed data:"}, {"t": "code", "lang": "sql", "x": "-- Cache blood inventory summary\nSELECT blood_group, SUM(units_available) as total_units\nFROM BloodInventory\nWHERE status = 'Available' AND expiry_date > GETDATE()\nGROUP BY blood_group;\n-- Cache this result for 5 minutes"}, {"t": "h3", "x": "3. Asynchronous Processing"}, {"t": "p", "x": "For non-critical operations, implement message queues:"}, {"t": "code", "lang": "sql", "x": "-- Queue for non-urgent notifications\nCREATE TABLE NotificationQueue (\n    id BIGINT IDENTITY PRIMARY KEY,\n    message_type VARCHAR(50),\n    recipient VARCHAR(100),\n    content NVARCHAR(MAX),\n    created_at DATETIME2 DEFAULT GETDATE(),\n    processed BIT DEFAULT 0\n);"}, {"t": "h2", "x": "The Real-World Impact: Why Database Design Matters"}, {"t": "p", "x": "Consider the scale at which big organizations work: they process millions of transactions daily while maintaining 99.99% uptime and sub-second response times."}, {"t": "p", "x": "Key Takeaways for Enterprise Systems:"}, {"t": "ul", "items": ["Design for Failure: Assume components will fail and build redundancy from the start", "Optimize for Common Queries: 80% of your performance gains come from optimizing the 20% most frequent queries", "Monitor Everything: Implement comprehensive logging and alerting for proactive issue resolution", "Scale Horizontally: Design databases that can be distributed across multiple servers as demand grows"]}, {"t": "h2", "x": "Database Design: The Foundation of Digital Healthcare"}, {"t": "p", "x": "As we’ve seen throughout this guide, thoughtful database design isn’t just about storing data, it’s about enabling life-saving decisions. Every optimization we’ve implemented, from strategic indexing to careful normalization, directly impacts patient outcomes."}, {"t": "p", "x": "The Pros of Robust Database Design:"}, {"t": "ul", "items": ["Reliability: Proper constraints and referential integrity prevent data corruption that could lead to medical errors", "Performance: Strategic indexing enables sub-second query responses critical for emergency situations", "Scalability: Well-designed schemas can grow from thousands to millions of records without performance degradation", "Compliance: Built-in audit trails and data validation support regulatory requirements"]}, {"t": "p", "x": "The Cons of Poor Database Design:"}, {"t": "ul", "items": ["Data Inconsistency: Without proper normalization, duplicate data can become inconsistent, leading to confusion about actual inventory levels", "Performance Bottlenecks: Missing indexes can cause simple queries to take minutes instead of milliseconds", "Scalability Nightmares: Poorly designed schemas require expensive rewrites as organizations grow", "Security Vulnerabilities: Inadequate access controls can expose sensitive patient information"]}, {"t": "p", "x": "The healthcare industry is increasingly digital, with Electronic Health Records, IoT medical devices and AI-powered diagnostics generating unprecedented amounts of data. The database professionals who understand how to design systems that are simultaneously robust, performant and secure will be the architects of tomorrow’s healthcare infrastructure."}, {"t": "p", "x": "Every database decision you make, from choosing the right data types to implementing the optimal indexing strategy, ripples through the entire healthcare ecosystem. Master these fundamentals and you’ll be equipped to build systems that don’t just store data, but save lives."}, {"t": "p", "x": "Remember: In healthcare databases, perfection isn’t just a goal, it’s a responsibility. The patient whose life depends on finding compatible blood in an emergency is counting on the database design decisions you make today."}, {"t": "p", "x": "Ready to implement your own blood donation management system? Start with the sample schemas and data we’ve provided, then gradually add the advanced features as your requirements grow. The journey from basic CRUD operations to enterprise-scale healthcare systems begins with solid fundamentals and you now have the roadmap to get there."}]}]};
var app=document.getElementById("app");

var KW={cs:"abstract as async await base bool break byte case catch char class const continue decimal default delegate do double else enum event extension field false finally float for foreach get if in init int interface internal is lock long namespace new null object out override partial private protected public readonly record ref required return sealed set short static string struct switch this throw true try typeof using var virtual void volatile while yield where select from",
sql:"SELECT FROM WHERE JOIN LEFT RIGHT INNER ON GROUP BY ORDER HAVING INSERT INTO VALUES UPDATE DELETE CREATE TABLE VIEW INDEX CLUSTERED NONCLUSTERED UNIQUE PRIMARY KEY FOREIGN REFERENCES CHECK DEFAULT NOT NULL AND OR IN AS IF BEGIN END RETURN RETURNS FUNCTION TRIGGER DECLARE SET EXEC GRANT ROLE ON WITH TOP DISTINCT CASE WHEN THEN ELSE INCLUDE CONSTRAINT SCHEMABINDING PARTITION SCHEME RANGE FOR AVAILABILITY GROUP REPLICA POLICY ADD FILTER PREDICATE ALTER DROP",
js:"function var let const return if else for while new class import from export async await true false null undefined this try catch throw typeof",
sh:"dotnet curl cd echo export git npm if then fi for do done"};
KW.csharp=KW.cs;KW.razor=KW.cs;KW.javascript=KW.js;KW.bash=KW.sh;
function hl(src,lang){
  lang=(lang||"").toLowerCase();var kws=KW[lang];
  var tag=(lang==="xml"||lang==="html");
  if(!kws&&!tag&&lang!=="css"&&lang!=="json")return esc(src);
  var set={};if(kws)kws.split(" ").forEach(function(w){set[lang==="sql"?w.toUpperCase():w]=1});
  var cm=lang==="sql"?"--[^\\n]*|/\\*[\\s\\S]*?\\*/":(lang==="bash"||lang==="sh")?"#[^\\n]*":(tag?"<!--[\\s\\S]*?-->":"//[^\\n]*|/\\*[\\s\\S]*?\\*/");
  var re=new RegExp("("+cm+")|(@?\"(?:[^\"\\\\]|\\\\.)*\"|'(?:[^'\\\\\\n]|\\\\.)*')|(\\b\\d[\\d.]*m?\\b)|(<\\/?[A-Za-z][\\w.:-]*)|([A-Za-z_@][\\w]*)","g");
  var out="",last=0,m;
  while((m=re.exec(src))){
    out+=esc(src.slice(last,m.index));last=re.lastIndex;var t=esc(m[0]);
    if(m[1])out+='<span class="tk-c">'+t+'</span>';
    else if(m[2])out+='<span class="tk-s">'+t+'</span>';
    else if(m[3])out+='<span class="tk-n">'+t+'</span>';
    else if(m[4]){if(tag||lang==="razor")out+='<span class="tk-t">'+t+'</span>';else{out+='&lt;';last=re.lastIndex=m.index+1;}}
    else if(m[5]){var w=lang==="sql"?m[5].toUpperCase():m[5];
      if(set[w])out+='<span class="tk-k">'+t+'</span>';
      else if(/^[A-Z]/.test(m[5])&&(lang==="cs"||lang==="csharp"||lang==="razor"))out+='<span class="tk-t">'+t+'</span>';
      else out+=t;}
  }
  return out+esc(src.slice(last));
}

    if(b.t==="img")return '<figure class="fig"><img src="'+esc(b.src)+'" alt="'+esc(b.alt)+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest(\'figure\').classList.add(\'noimg\')">'+(b.cap?'<figcaption>'+esc(b.cap)+'</figcaption>':'')+'</figure>';
    if(b.t==="code")return '<div class="codeblock">'+(b.lang?'<span class="mono">'+esc(b.lang)+'</span>':'')+'<pre><code>'+hl(b.x,b.lang)+'</code></pre></div>';

var rp=null,rpf=null,rpp=null,onScroll=null;
function stopProgress(){if(onScroll){window.removeEventListener("scroll",onScroll);window.removeEventListener("resize",onScroll);onScroll=null}if(rp){rp.remove();rp=null}}
function startProgress(){
  stopProgress();
  var pm=document.getElementById("pm");if(!pm)return;
  rp=document.createElement("button");rp.id="rp";rp.type="button";rp.title="Reading progress · click to go to top";rp.setAttribute("aria-label","Reading progress, click to scroll to top");
  rp.innerHTML='<svg viewBox="0 0 56 56" aria-hidden="true"><circle class="tr" cx="28" cy="28" r="25"/><circle class="pg" cx="28" cy="28" r="25"/></svg><b>0%</b>';
  rp.addEventListener("click",function(){window.scrollTo({top:0,behavior:"smooth"})});
  document.body.appendChild(rp);rpf=rp.querySelector(".pg");rpp=rp.querySelector("b");
  var links=[].slice.call(document.querySelectorAll(".toc a")),heads=links.map(function(a){return document.getElementById("sec-"+a.getAttribute("data-i"))});
  links.forEach(function(a,i){a.addEventListener("click",function(e){e.preventDefault();if(heads[i])heads[i].scrollIntoView({behavior:"smooth"})})});
  var tick=false,lastCur=-1;
  function update(){
    tick=false;
    var r=pm.getBoundingClientRect(),vh=window.innerHeight,total=r.height-vh*0.5,done=-r.top+vh*0.15;
    var pct=Math.max(0,Math.min(1,total>0?done/total:1));
    rpf.style.strokeDashoffset=157.08*(1-pct);rpp.textContent=pct>=0.995?"✓":Math.round(pct*100)+"%";rp.classList.toggle("done",pct>=0.995);
    var cur=-1;heads.forEach(function(h,i){if(h&&h.getBoundingClientRect().top<vh*0.3)cur=i});
    if(pct>=0.995&&heads.length)cur=heads.length-1;
    links.forEach(function(a,i){a.classList.toggle("on",i===cur)});
    if(cur>=0&&cur!==lastCur){lastCur=cur;var t=links[cur].parentNode,a=links[cur];if(a.offsetTop<t.scrollTop||a.offsetTop+a.offsetHeight>t.scrollTop+t.clientHeight)t.scrollTop=a.offsetTop-40}
  }
  onScroll=function(){if(!tick){tick=true;requestAnimationFrame(update)}};
  window.addEventListener("scroll",onScroll,{passive:true});window.addEventListener("resize",onScroll);update();
}
