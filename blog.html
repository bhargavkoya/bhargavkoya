<style>
/* Layout idea: one bordered "sheet" per section; hero with a facts table, then a numbered index beside a detail pane. */
:root{
  --bg:#f5f5f2; --panel:#ffffff; --ink:#15161a; --muted:#5d6070; --line:#dcdcd6;
  --accent:#4048d6; --accent-soft:#e8e9fb; --good:#0f8a5f;
  --display:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0d11; --panel:#12141a; --ink:#eceef4; --muted:#9a9eb0; --line:#252835;
    --accent:#8e96ff; --accent-soft:#1c2040; --good:#4fd1a1; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0d11; --panel:#12141a; --ink:#eceef4; --muted:#9a9eb0; --line:#252835;
  --accent:#8e96ff; --accent-soft:#1c2040; --good:#4fd1a1; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* nav */
header.nav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;font-size:15px}
.brand .mark{width:32px;height:32px;border-radius:50%;object-fit:cover;display:block;border:1px solid var(--line)}
.nav nav{display:flex;align-items:center;gap:6px}
.nav nav a{font-size:14px;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px}
.nav nav a:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;font:500 14px var(--display);padding:8px 16px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink);text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.primary:hover{filter:brightness(1.08)}
.icon-btn{width:36px;height:36px;padding:0;justify-content:center}

section.sheet{margin-top:20px;border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}
.pad{padding:clamp(20px,4vw,40px)}

/* hero */
.hero-top{display:flex;align-items:center;gap:14px}
.avatar{width:56px;height:56px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-weight:500;color:var(--accent)}
.hero-top strong{display:block;font-size:17px}
h1{font-size:clamp(34px,5.6vw,58px);line-height:1.06;letter-spacing:-.025em;font-weight:600;margin:28px 0 0;max-width:17ch;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.hero-grid{display:grid;grid-template-columns:1.15fr 1fr;border-top:1px solid var(--line)}
.hero-grid>div{padding:clamp(20px,4vw,40px)}
.intro p{margin:0 0 14px;color:var(--muted);max-width:60ch}
.intro .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.facts{border-left:1px solid var(--line)}
.facts dl{margin:0}
.facts .row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.facts .row:last-child{border-bottom:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;text-align:right;font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.facts dd a{color:var(--accent);text-decoration:none}
.facts dd.good{color:var(--good)}
.stack{display:flex;flex-wrap:wrap;gap:8px;padding:18px clamp(20px,4vw,40px);border-top:1px solid var(--line)}
.chip{font-family:var(--mono);font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}

/* work index */
.work{display:grid;grid-template-columns:320px 1fr}
.index{border-right:1px solid var(--line)}
.index .mono{display:flex;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.index button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:4px 8px;padding:14px 20px;border-bottom:1px solid var(--line);border-left:3px solid transparent}
.index button:hover{background:var(--accent-soft)}
.index button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.index button[aria-selected="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.index .n{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
.index .t{font-weight:600;font-size:15px;line-height:1.3}
.index .s{grid-column:2;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.detail{padding:clamp(20px,4vw,40px)}
.detail h2{font-size:clamp(26px,3.6vw,38px);letter-spacing:-.02em;line-height:1.12;margin:10px 0 14px;font-weight:600;text-wrap:balance}
.detail p{color:var(--muted);max-width:60ch;margin:0 0 14px}
.detail .tags{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 24px}
.detail .links{display:flex;flex-wrap:wrap;gap:10px}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-right:6px}
.points{margin:0 0 6px;padding:0;list-style:none;display:grid;gap:8px;max-width:60ch}
.points li{padding-left:18px;position:relative;color:var(--muted)}
.points li::before{content:"";position:absolute;left:0;top:.72em;width:8px;height:1px;background:var(--accent)}

/* writing */
.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.section-head h2{margin:8px 0 0;font-size:clamp(26px,3.6vw,38px);letter-spacing:-.02em;line-height:1.12;font-weight:600;text-wrap:balance}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.topic{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--bg)}
.topic .mono{display:block;margin-bottom:6px}
.topic b{display:block;font-size:15px;line-height:1.35}
.lede{color:var(--muted);max-width:62ch;margin:0 0 24px}


/* blog */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(20px,3vw,32px)}
.col-h{display:flex;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.col-h a{color:var(--accent);text-decoration:none}
.col-h span:first-child{color:var(--ink)}
.post{display:grid;grid-template-columns:28px 1fr 16px;gap:12px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none}
.post .d{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.post .pt{font-size:15px;line-height:1.4;text-wrap:pretty}
.post .ar{color:var(--muted);font-family:var(--mono);font-size:12px}
.post:hover .pt,.post:hover .ar{color:var(--accent)}
@media (max-width:860px){.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(20px,3vw,32px)}}

/* repo index */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.filters button{font:500 13px var(--display);padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.repos{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.repo{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;background:var(--bg)}
.repo:hover{border-color:var(--accent)}
.repo b{font-family:var(--mono);font-size:13px;font-weight:500;word-break:break-word}
.repo span{color:var(--muted);font-size:14px;line-height:1.45}
.repo .mono{margin-top:auto;padding-top:6px;font-size:10.5px}
.repo[hidden]{display:none}

/* contact */
.contact{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(20px,4vw,48px);align-items:start}
.contact h2{margin:8px 0 14px;font-size:clamp(28px,4.4vw,46px);letter-spacing:-.025em;line-height:1.08;font-weight:600;text-wrap:balance}
.contact p{color:var(--muted);max-width:50ch;margin:0 0 20px}
.links-list a{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:15px}
.links-list a:first-child{border-top:1px solid var(--line)}
.links-list a:hover span:last-child{color:var(--accent)}
.links-list span:last-child{font-family:var(--mono);font-size:12px;color:var(--muted)}
footer{padding:28px 0 48px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:860px){
  .hero-grid,.work,.contact{grid-template-columns:1fr}
  .facts{border-left:0;border-top:1px solid var(--line)}
  .index{border-right:0;border-bottom:1px solid var(--line)}
  .nav nav a.hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* blog page */
.page-head{padding:clamp(28px,5vw,56px) 0 8px}
.page-head h1{max-width:20ch}
.page-head p{color:var(--muted);max-width:60ch;margin:16px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.chips a{font:500 13px var(--display);padding:6px 14px;border-radius:999px;border:1px solid var(--line);color:var(--muted);text-decoration:none;background:var(--panel)}
.chips a:hover{border-color:var(--accent);color:var(--ink)}
.chips a b{font-family:var(--mono);font-weight:500;font-size:11px;margin-left:6px;color:var(--accent)}
.series-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.series-head h2{margin:6px 0 4px;font-size:clamp(22px,3vw,30px);letter-spacing:-.02em;font-weight:600}
.series-head p{margin:0;color:var(--muted);font-size:15px}
.plist{margin-top:14px;border-top:1px solid var(--ink)}
.prow{display:grid;grid-template-columns:110px 1fr 16px;gap:16px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none}
.prow .d{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.prow .pt{font-weight:600;font-size:17px;line-height:1.35;text-wrap:balance}
.prow .ex{display:block;color:var(--muted);font-weight:400;font-size:14.5px;margin-top:4px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prow .ar{color:var(--muted);font-family:var(--mono)}
.prow:hover .pt,.prow:hover .ar{color:var(--accent)}
/* post view */
.back{display:inline-flex;gap:8px;font:500 14px var(--display);color:var(--muted);text-decoration:none;margin:8px 0 18px}
.back:hover{color:var(--ink)}
.post-view h1{font-size:clamp(28px,4.6vw,46px);max-width:none;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:18px}
.meta a{color:var(--accent);text-decoration:none}
.read{position:relative;margin-top:32px}
.read p{font-size:clamp(17px,2vw,19px);line-height:1.75;margin:0}
.read .fade{position:absolute;left:0;right:0;bottom:-1px;height:90px;background:linear-gradient(to bottom,transparent,var(--panel));pointer-events:none}
.gate{margin-top:0;border:1px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.gate b{font-size:19px;line-height:1.3}
.gate p{margin:0;color:var(--muted);font-size:15px}
.gate .btn{align-self:flex-start}
.more{margin-top:36px}

.post-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(24px,4vw,56px);margin-top:8px}
.post-grid.has-toc{grid-template-columns:minmax(0,1fr) 300px}
.post-main{min-width:0}
.toc{position:sticky;top:84px;align-self:start;margin-top:32px;display:flex;flex-direction:column;max-height:calc(100vh - 110px);border:1px solid var(--line);border-radius:16px;background:var(--bg);overflow:hidden}
.toc-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.toc-head .mono{display:block;color:var(--ink);font-weight:500}
.toc-head small{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.toc-list{position:relative;overflow:auto;padding:8px;scrollbar-width:thin}
.toc-list a{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:baseline;padding:9px 10px;border-radius:10px;border-left:3px solid transparent;font-size:14px;line-height:1.4;color:var(--muted);text-decoration:none}
.toc-list a i{font:normal 500 11.5px var(--mono);color:var(--muted)}
.toc-list a:hover{color:var(--ink);background:var(--accent-soft)}
.toc-list a.on{color:var(--ink);font-weight:600;background:var(--accent-soft);border-left-color:var(--accent)}
.toc-list a.on i{color:var(--accent)}

@media (max-width:980px){.post-grid.has-toc{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
.post-view section.sheet{overflow:visible}
.rp{position:fixed;right:clamp(12px,2vw,28px);top:50%;transform:translateY(-50%);width:64px;height:64px;z-index:30;border:0;padding:0;border-radius:50%;background:var(--panel);box-shadow:0 2px 14px rgba(0,0,0,.14);cursor:pointer;color:var(--ink)}
.rp svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.rp circle{fill:none;stroke-width:4}
.rp .tr{stroke:var(--line)}
.rp .pg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:157.08;stroke-dashoffset:157.08;transition:stroke-dashoffset .12s linear}
.rp b{position:absolute;inset:0;display:grid;place-items:center;font:500 12px var(--mono)}
.rp:hover{border-color:var(--accent)}
.rp.in{position:relative;transform:none;width:48px;height:48px;flex:none;box-shadow:none;border:0;background:transparent}
.rp.in b{font-size:11.5px;font-weight:700}
.rp.in circle{stroke-width:4}
@media (min-width:981px){.has-toc-page .rp.fx{display:none}}
@media (max-width:980px){.rp.in{display:none}}
.rp.done .pg{stroke:var(--good)}
@media (max-width:640px){.rp.fx{width:52px;height:52px;top:auto;bottom:16px;transform:none}.rp b{font-size:11px}}
.article{margin-top:32px}
.article p,.article li{font-size:clamp(16.5px,1.9vw,18px);line-height:1.75}
.article p{margin:0 0 18px}
.article h2{scroll-margin-top:84px;font-size:clamp(22px,3vw,28px);letter-spacing:-.015em;line-height:1.2;margin:44px 0 14px;font-weight:600;text-wrap:balance}
.article h3{font-size:19px;line-height:1.3;margin:30px 0 10px;font-weight:600}
.article ul{margin:0 0 20px;padding-left:22px;display:grid;gap:6px}
.article li::marker{color:var(--accent)}
.codeblock{margin:6px 0 22px;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.codeblock .mono{display:block;padding:8px 14px;border-bottom:1px solid var(--line);font-size:10.5px}
.codeblock pre{margin:0;padding:14px;overflow-x:auto;font:13px/1.6 var(--mono);tab-size:4}
.tk-c{color:var(--tc,#6a7280);font-style:italic}.tk-s{color:var(--ts,#0f7a55)}.tk-k{color:var(--tk,#b0307a)}.tk-n{color:var(--tn,#b45309)}.tk-t{color:var(--tt,#1d6fb8)}
:root[data-theme="dark"]{--tc:#7d869c;--ts:#7fd6a8;--tk:#f08fc0;--tn:#f0b36a;--tt:#7db8f5}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--tc:#7d869c;--ts:#7fd6a8;--tk:#f08fc0;--tn:#f0b36a;--tt:#7db8f5}}
.codeblock code{font:inherit;color:var(--ink);white-space:pre}
.prow .pill{margin:0 0 0 8px;vertical-align:2px}

.fig{margin:6px 0 26px}
.fig img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.fig figcaption{margin-top:8px;font-size:13px;color:var(--muted);line-height:1.5}
.fig.noimg img{display:none}
.fig.noimg:not(:has(figcaption)){display:none}
.article.is-preview{position:relative;margin-bottom:0}
.article.is-preview .fade{position:absolute;left:0;right:0;bottom:0;height:110px;background:linear-gradient(to bottom,transparent,var(--panel));pointer-events:none}
@media (max-width:640px){.prow{grid-template-columns:1fr 16px}.prow .d{grid-column:1/-1}}
</style>
</head>

(function(){
var DATA=null;
function parseMd(src){

  function flush(){if(para.length){out.push({t:"p",x:para.join(" ")});para=[]}}
  while(i<lines.length){
    var l=lines[i],m;
    if((m=/^```\s*([\w#+-]*)\s*$/.exec(l))){
      flush();var code=[];i++;
      while(i<lines.length&&!/^```\s*$/.test(lines[i])){code.push(lines[i]);i++}
      i++;var b={t:"code"};if(m[1])b.lang=m[1];b.x=code.join("\n");
      out.push(b);continue;
    }
    if((m=/^@@preview(?:\s+(public))?\s*$/.exec(l))){meta.preview=true;if(m[1])meta.pub=true;i++;continue}

    if(!l.trim()){flush();i++;continue}
    if((m=/^###\s+(.*)$/.exec(l))){flush();out.push({t:"h3",x:m[1].trim()});i++;continue}
    if((m=/^##\s+(.*)$/.exec(l))){flush();out.push({t:"h2",x:m[1].trim()});i++;continue}
    if(/^-\s+/.test(l)){flush();var items=[];while(i<lines.length&&/^-\s+/.test(lines[i])){items.push(lines[i].replace(/^-\s+/,"").trim());i++}out.push({t:"ul",items:items});continue}
    para.push(l.trim());i++;
  }
  flush();return {meta:meta,body:out};
}

var app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(d){if(!d)return "";var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],p=d.split("-");return parseInt(p[2],10)+" "+m[parseInt(p[1],10)-1]+" "+p[0]}
function ser(id){return DATA.series.filter(function(s){return s.id===id})[0]}
function row(p,showSeries){
  return '<a class="prow" href="#post-'+p.id+'"><span class="d">'+esc(fmt(p.date)||"Medium")+'</span><span class="pt">'+esc(p.title)+(p.excerpt?'<span class="ex">'+esc(p.excerpt)+'</span>':'')+'</span><span class="ar" aria-hidden="true">→</span></a>';
}
function list(){
  document.title="Blog · Bhargava Koya";
  var h='<div class="page-head"><span class="mono">Blog · five series on Medium</span><h1>Stories on .NET, AI and system design</h1>'+
   '<p>Each story opens here with its first few paragraphs. When you want the rest, the full version is on Medium.</p><div class="chips">'+
   DATA.series.map(function(s){return '<a href="#series-'+s.id+'">'+esc(s.name)+'<b>'+s.count+'</b></a>'}).join('')+'</div></div>';
  DATA.series.forEach(function(s){
    var ps=DATA.posts.filter(function(p){return p.series===s.id});

  });
  app.innerHTML=h;
}

var KW={cs:"abstract as async await base bool break byte case catch char class const continue decimal default delegate do double else enum event extension field false finally float for foreach get if in init int interface internal is lock long namespace new null object out override partial private protected public readonly record ref required return sealed set short static string struct switch this throw true try typeof using var virtual void volatile while yield where select from",
sql:"SELECT FROM WHERE JOIN LEFT RIGHT INNER ON GROUP BY ORDER HAVING INSERT INTO VALUES UPDATE DELETE CREATE TABLE VIEW INDEX CLUSTERED NONCLUSTERED UNIQUE PRIMARY KEY FOREIGN REFERENCES CHECK DEFAULT NOT NULL AND OR IN AS IF BEGIN END RETURN RETURNS FUNCTION TRIGGER DECLARE SET EXEC GRANT ROLE ON WITH TOP DISTINCT CASE WHEN THEN ELSE INCLUDE CONSTRAINT SCHEMABINDING PARTITION SCHEME RANGE FOR AVAILABILITY GROUP REPLICA POLICY ADD FILTER PREDICATE ALTER DROP",
js:"function var let const return if else for while new class import from export async await true false null undefined this try catch throw typeof",
sh:"dotnet curl cd echo export git npm if then fi for do done"};
KW.csharp=KW.cs;KW.razor=KW.cs;KW.javascript=KW.js;KW.bash=KW.sh;
function hl(src,lang){
  lang=(lang||"").toLowerCase();var kws=KW[lang];
  var tag=(lang==="xml"||lang==="html");
  if(!kws&&!tag&&lang!=="css"&&lang!=="json")return esc(src);
  var set={};if(kws)kws.split(" ").forEach(function(w){set[lang==="sql"?w.toUpperCase():w]=1});
  var cm=lang==="sql"?"--[^\\n]*|/\\*[\\s\\S]*?\\*/":(lang==="bash"||lang==="sh")?"#[^\\n]*":(tag?"<!--[\\s\\S]*?-->":"//[^\\n]*|/\\*[\\s\\S]*?\\*/");
  var re=new RegExp("("+cm+")|(@?\"(?:[^\"\\\\]|\\\\.)*\"|'(?:[^'\\\\\\n]|\\\\.)*')|(\\b\\d[\\d.]*m?\\b)|(<\\/?[A-Za-z][\\w.:-]*)|([A-Za-z_@][\\w]*)","g");
  var out="",last=0,m;
  while((m=re.exec(src))){
    out+=esc(src.slice(last,m.index));last=re.lastIndex;var t=esc(m[0]);
    if(m[1])out+='<span class="tk-c">'+t+'</span>';
    else if(m[2])out+='<span class="tk-s">'+t+'</span>';
    else if(m[3])out+='<span class="tk-n">'+t+'</span>';
    else if(m[4]){if(tag||lang==="razor")out+='<span class="tk-t">'+t+'</span>';else{out+='&lt;';last=re.lastIndex=m.index+1;}}
    else if(m[5]){var w=lang==="sql"?m[5].toUpperCase():m[5];
      if(set[w])out+='<span class="tk-k">'+t+'</span>';
      else if(/^[A-Z]/.test(m[5])&&(lang==="cs"||lang==="csharp"||lang==="razor"))out+='<span class="tk-t">'+t+'</span>';
      else out+=t;}
  }
  return out+esc(src.slice(last));
}
function body(p){
  var hn=0;
  return p.body.map(function(b){
    if(b.t==="h2")return '<h2 id="sec-'+(hn++)+'">'+esc(b.x)+'</h2>';
    if(b.t==="h3")return '<h3>'+esc(b.x)+'</h3>';
    if(b.t==="ul")return '<ul>'+b.items.map(function(i){return '<li>'+esc(i)+'</li>'}).join('')+'</ul>';
    if(b.t==="img")return '<figure class="fig"><img src="'+esc(b.src)+'" alt="'+esc(b.alt)+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest(\'figure\').classList.add(\'noimg\')">'+(b.cap?'<figcaption>'+esc(b.cap)+'</figcaption>':'')+'</figure>';
    if(b.t==="code")return '<div class="codeblock">'+(b.lang?'<span class="mono">'+esc(b.lang)+'</span>':'')+'<pre><code>'+hl(b.x,b.lang)+'</code></pre></div>';
    return '<p>'+esc(b.x)+'</p>';
  }).join('');
}
function loadPost(p){
  if(p.loaded)return Promise.resolve(p);
  return fetch("content/"+p.id+".md").then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
    var r=parseMd(t);p.body=r.body;p.preview=r.meta.preview;p.pub=r.meta.pub;p.loaded=true;return p;
  }).catch(function(){p.loaded=true;return p});
}
function post(id){
  var p=DATA.posts.filter(function(x){return x.id===id})[0];
  if(!p){location.hash="";return Promise.resolve(list());}
  var tok=++navTok;
  app.innerHTML='<p class="lede" style="padding:48px 0">Loading story…</p>';
  return loadPost(p).then(function(){if(tok===navTok)renderPost(p)});
}
function renderPost(p){
  var s=ser(p.series);
  document.title=p.title+" · Bhargava Koya";
  var more=DATA.posts.filter(function(x){return x.series===p.series&&x.id!==p.id});
  var full=!!p.body&&!p.preview;var prev=!!p.body&&!!p.preview;
  var cta='<div class="gate" style="margin-top:'+(full?'40px':'0')+'"><b>'+(full?'Originally published on Medium':'Read the complete story on Medium')+'</b><p>'+(full?'Enjoyed it? Follow along, leave a comment or share it from the original post.':(prev?(p.pub?'This is the first part of a long guide. The remaining steps, with the middleware, configuration and deployment code, are on Medium.':'This is the opening of a Medium member-only story. The rest, with the full code and diagrams, is on Medium.'):'This is the opening of the story. The full article is on Medium.'))+'</p><a class="btn primary" href="'+p.url+'">'+(full?'View on Medium ↗':'Continue reading on Medium ↗')+'</a></div>';
  var hs=(full||prev)?p.body.filter(function(b){return b.t==="h2"}):[];
  var toc=hs.length>2?'<aside class="toc" aria-label="In this post"><div class="toc-head"><div><span class="mono">In this post</span><small>'+hs.length+' sections</small></div><span id="rp-slot"></span></div><div class="toc-list">'+hs.map(function(b,i){return '<a href="#sec-'+i+'" data-i="'+i+'"><i>'+(i<9?'0':'')+(i+1)+'</i><span>'+esc(b.x)+'</span></a>'}).join('')+'</div></aside>':'';
  var content=(full||prev)?'<div class="article'+(prev?' is-preview':'')+'">'+body(p)+(prev?'<div class="fade"></div>':'')+'</div>':(p.excerpt?'<div class="read"><p>'+esc(p.excerpt)+'</p></div>':'');
  app.innerHTML='<div class="post-view" style="padding-top:24px"><a class="back" href="#series-'+s.id+'">← '+esc(s.name)+'</a>'+
   '<section class="sheet" style="margin-top:0"><div class="pad"><span class="mono">'+esc(s.name)+(p.date?' · '+esc(fmt(p.date)):'')+(full?' · Full story':(prev?' · Preview':''))+'</span><h1>'+esc(p.title)+'</h1><div class="post-grid'+(toc?' has-toc':'')+'"><div class="post-main" id="pm">'+content+cta+'</div>'+toc+'</div></div></section>'+
   (more.length?'<section class="sheet more"><div class="pad"><span class="mono">More from '+esc(s.name)+'</span><div class="plist">'+more.map(row).join('')+'</div></div></section>':'')+'</div>';
}
var rps=[],onScroll=null,navTok=0;
function stopProgress(){if(onScroll){window.removeEventListener("scroll",onScroll);window.removeEventListener("resize",onScroll);onScroll=null}rps.forEach(function(r){r.remove()});rps=[];document.body.classList.remove("has-toc-page")}
function startProgress(){
  stopProgress();
  var pm=document.getElementById("pm");if(!pm)return;
  function ring(cls){
    var r=document.createElement("button");r.type="button";r.className="rp "+cls;r.title="Reading progress · click to go to top";r.setAttribute("aria-label","Reading progress, click to scroll to top");
    r.innerHTML='<svg viewBox="0 0 56 56" aria-hidden="true"><circle class="tr" cx="28" cy="28" r="25"/><circle class="pg" cx="28" cy="28" r="25"/></svg><b>0%</b>';
    r.addEventListener("click",function(){window.scrollTo({top:0,behavior:"smooth"})});rps.push(r);return r;
  }
  document.body.appendChild(ring("fx"));
  var slot=document.getElementById("rp-slot");if(slot){slot.appendChild(ring("in"));document.body.classList.add("has-toc-page")}
  var links=[].slice.call(document.querySelectorAll(".toc a")),heads=links.map(function(a){return document.getElementById("sec-"+a.getAttribute("data-i"))});
  links.forEach(function(a,i){a.addEventListener("click",function(e){e.preventDefault();if(heads[i])heads[i].scrollIntoView({behavior:"smooth"})})});
  var tick=false,lastCur=-1;
  function update(){
    tick=false;
    var r=pm.getBoundingClientRect(),vh=window.innerHeight,total=r.height-vh*0.5,done=-r.top+vh*0.15;
    var pct=Math.max(0,Math.min(1,total>0?done/total:1));
    rps.forEach(function(r){r.querySelector(".pg").style.strokeDashoffset=157.08*(1-pct);r.querySelector("b").textContent=pct>=0.995?"✓":Math.round(pct*100);r.classList.toggle("done",pct>=0.995)});
    var cur=-1;heads.forEach(function(h,i){if(h&&h.getBoundingClientRect().top<vh*0.3)cur=i});
    if(pct>=0.995&&heads.length)cur=heads.length-1;
    links.forEach(function(a,i){a.classList.toggle("on",i===cur)});
    if(cur>=0&&cur!==lastCur){lastCur=cur;var t=links[cur].parentNode,a=links[cur];if(a.offsetTop<t.scrollTop||a.offsetTop+a.offsetHeight>t.scrollTop+t.clientHeight)t.scrollTop=a.offsetTop-40}
  }
  onScroll=function(){if(!tick){tick=true;requestAnimationFrame(update)}};
  window.addEventListener("scroll",onScroll,{passive:true});window.addEventListener("resize",onScroll);update();
}
function route(){
  stopProgress();
  var h=location.hash.replace("#","");
  ++navTok;
  if(h.indexOf("post-")===0){var pr=post(h.slice(5)),tok=navTok;pr.then(function(){if(tok===navTok){window.scrollTo(0,0);startProgress()}});}
  else{list();if(h){var el=document.getElementById(h);if(el)el.scrollIntoView();}else window.scrollTo(0,0);}
}
window.addEventListener("hashchange",function(){if(DATA)route()});
fetch("posts.json").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){DATA=d;route()}).catch(function(){
  app.innerHTML='<div class="page-head"><h1>Blog unavailable</h1><p>The post list could not be loaded. If you opened this file directly from disk, serve the folder over HTTP instead (for example <code>python -m http.server</code>).</p></div>';
});

try{var saved=localStorage.getItem("bk-theme");if(saved)root.setAttribute("data-theme",saved);}catch(e){}

document.getElementById("theme").addEventListener("click",toggle);
